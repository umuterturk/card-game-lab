name: Swing Casual onboarding checks
on:
  pull_request:
    paths:
      - 'src/casual/**'
      - 'src/external/engines.js'
      - 'tests/casual-onboarding.test.mjs'
      - '.github/workflows/casual-onboarding.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run verify:release
