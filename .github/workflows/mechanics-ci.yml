name: Overswing Mechanics CI
on:
  push:
    branches: [feature/overswing-mechanics-v14]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Verify production build
        run: npm run build
      - name: Verify release package
        run: npm run verify:release
      - name: Run game tests
        run: npm test
      - name: Extended Royal simulation (48,000 encounters)
        run: node experiments/run-overswing-royals.mjs 1000 900000
      - name: Campaign-wide simulation (54,000 encounters)
        run: node experiments/run-overswing-campaign-v14.mjs 250 950000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overswing-mechanics-simulation
          path: |
            artifacts/royal-simulation.*
            artifacts/campaign-v14.*
